name: Synthetic verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            numpy: '1.26.4'
            scipy: '1.14.0'
          - python: '3.12'
            numpy: '2.0.2'
            scipy: '1.14.1'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'numpy==${{ matrix.numpy }}' 'scipy==${{ matrix.scipy }}' 'scikit-learn==1.5.0' 'pytest==8.3.5' 'build==1.2.2.post1' 'h5py==3.12.1' 'nbformat==5.10.4' 'matplotlib==3.9.2'
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m build --outdir "$RUNNER_TEMP/distributions"
      - run: hera-systematics --help
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install 'numpy==1.26.4' 'scipy==1.14.0' 'astropy==6.1.2' 'h5py==3.12.1' 'pyuvdata==3.2.0' 'pytest==8.3.5'
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q tests/test_ideal_uvh5.py tests/test_cornerturn.py tests/test_visibility_cli.py tests/test_ideal_batch.py
